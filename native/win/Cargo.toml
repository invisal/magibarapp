[package]
name = "win_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
sysinfo = "0.32"
listeners = "0.6.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Ole", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_LibraryLoader"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
