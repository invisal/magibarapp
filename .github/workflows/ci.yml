name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Each OS's own @magibar/<os> optionalDependency install script
    # (napi build --release) runs as part of `npm ci` below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs per-OS (not just once on ubuntu) because a handful of types come
      # from optionalDependencies that only install on their matching platform
      # (@magibar/{win,mac,linux}, macOS-only electron-liquid-glass) — this is
      # the only way to catch a platform's real installed types disagreeing
      # with the committed/ambient declarations the other platforms fall back
      # to (tsconfig.node.json `paths` for @magibar/*, an ambient `declare
      # module` for electron-liquid-glass).
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Packaging smoke test only — no publish, no signing. electron-builder.yml
      # has mac.notarize: true, but only release.yml imports the real Apple
      # signing certificate; CSC_IDENTITY_AUTO_DISCOVERY=false makes
      # electron-builder skip signing here (and skip notarizing an unsigned
      # app), so this stays fast and needs no Apple secrets.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir --publish never

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --dir --publish never

  # Not a gate for macOS-only extensions failing — just proves the engine loads
  # real Store extensions on Linux. Network-dependent, so it can't block merges.
  raycast-linux:
    name: Raycast compat (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Raycast compat smoke test
        run: node --disable-warning=ExperimentalWarning scripts/raycast-compat.ts emoji github brew
