appId: app.magibar
productName: Magibar

directories:
  output: dist
  buildResources: build

# electron-vite emits the app into out/; node_modules (prod + optional deps) is
# added automatically by electron-builder. resources/ holds main-process-only
# static assets referenced via `?asset` imports (e.g. the tray icon) — electron-vite
# resolves those to a path next to out/ at runtime, so it has to ship alongside it.
files:
  - out/**
  - resources/**
  - package.json
  # Developer-only harness for the GNOME Shell extension next to it — it drives
  # that extension against Mutter's typelib outside of GNOME Shell (see the file
  # header) and has no place in a shipped build.
  - "!resources/gnome-extension/verify.js"
  # @magibar/{win,mac,linux} each ship a prebuilt napi .node but also carry
  # their Rust source and build tree (~700 MB) — keep only what the addon
  # needs at runtime.
  - "!node_modules/@magibar/win/target/**"
  - "!node_modules/@magibar/win/src/**"
  - "!node_modules/@magibar/win/node_modules/**"
  - "!node_modules/@magibar/win/Cargo.*"
  - "!node_modules/@magibar/win/build.rs"
  - "!node_modules/@magibar/win/package-lock.json"
  - "!node_modules/@magibar/mac/target/**"
  - "!node_modules/@magibar/mac/src/**"
  - "!node_modules/@magibar/mac/node_modules/**"
  - "!node_modules/@magibar/mac/Cargo.*"
  - "!node_modules/@magibar/mac/build.rs"
  - "!node_modules/@magibar/mac/package-lock.json"
  - "!node_modules/@magibar/linux/target/**"
  - "!node_modules/@magibar/linux/src/**"
  - "!node_modules/@magibar/linux/node_modules/**"
  - "!node_modules/@magibar/linux/Cargo.*"
  - "!node_modules/@magibar/linux/build.rs"
  - "!node_modules/@magibar/linux/package-lock.json"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@magibar/**"
  # The plugin engine's source-build fallback (src/plugin-engine/install/
  # bundle.ts) runs esbuild, whose per-platform native binary can't execute
  # from inside app.asar. Store installs never touch it.
  - "node_modules/esbuild/**"
  - "node_modules/@esbuild/**"

# @magibar/{win,mac,linux} are all Node-API (ABI-stable) prebuilts; nothing
# here needs a native rebuild against Electron headers.
npmRebuild: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  # electron-builder's own default for a one-click installer, spelled out so
  # it's not just an implicit behavior: Magibar launches itself the moment
  # setup finishes, which is what puts the first-run onboarding window in
  # front of the user right after install (see `main/onboarding-window.ts`).
  # There's no equivalent hook for the plain .dmg on macOS — a dmg is a drag-
  # to-Applications install with no post-install step, so onboarding there
  # only shows the first time the user opens the app themselves. AppImage on
  # Linux has no separate "install" step at all — running it IS the first run.
  runAfterFinish: true

mac:
  category: public.app-category.utilities
  target:
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Only signs/notarizes when release.yml's Apple secrets are present (see
  # that workflow's "Import Apple certificate" step) — CSC_IDENTITY_AUTO_DISCOVERY
  # is left at its default so a plain `npm run dist:mac` locally without a
  # keychain cert still produces an unsigned build for testing.
  notarize: true

dmg:
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Run under XWayland: on a Wayland session Electron otherwise picks its
  # native Wayland backend, where GTK aborts at startup ("Can't create a
  # GtkStyleContext without a display connection"). The switch has to be on
  # the command line — app.commandLine.appendSwitch() runs too late for it.
  executableArgs:
    - --ozone-platform=x11

# Windows has no codesigning certificate yet, so release.yml ships it
# unsigned for now (SmartScreen will warn on install) until a cert (or
# Azure Trusted Signing) is wired in via CSC_LINK/CSC_KEY_PASSWORD or a
# signing action step. macOS is signed + notarized (see mac: above).
publish:
  provider: github
  owner: invisal
  repo: magibarapp
